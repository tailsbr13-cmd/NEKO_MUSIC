name: Criar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Instala o Gradle 8.9 (o projeto não traz o gradlew)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        run: |
          # Acha a pasta que contém o settings.gradle.kts (caso o projeto esteja numa subpasta)
          ROOT=$(dirname "$(find . -maxdepth 3 -name settings.gradle.kts | head -n1)")
          echo "Projeto em: $ROOT"
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NekoMusic-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
