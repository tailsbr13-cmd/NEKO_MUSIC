name: Criar APK

on:
  workflow_dispatch:

# Permissão necessária para publicar nas Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Baixar o código do repositório
      - name: Baixar repositório
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Localizar o projeto Android
      - name: Localizar projeto
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Gradle Wrapper não encontrado!"
            exit 1
          fi

          echo "ROOT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      # 5. Compilar APK
      - name: Compilar APK
        shell: bash
        run: |
          chmod +x "$ROOT/gradlew"
          "$ROOT/gradlew" -p "$ROOT" assembleDebug --stacktrace

      # 6. Publicar APK diretamente em Lançamentos
      - name: Publicar APK em Lançamentos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          APK=$(find "$ROOT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi encontrado!"
            exit 1
          fi

          echo "APK encontrado: $APK"

          cp "$APK" NekoMusic.apk

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" NekoMusic.apk \
            --title "NEKO MUSIC build ${GITHUB_RUN_NUMBER}" \
            --notes "APK de instalação do NEKO MUSIC. Baixe NekoMusic.apk e instale no Android." \
            --latest
