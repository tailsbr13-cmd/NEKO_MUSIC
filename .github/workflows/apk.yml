
name: Criar APK

on:
  workflow_dispatch:

# Permissão para publicar em Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Extrair projeto, caso tenha sido enviado em ZIP
      - name: Extrair NekoMusic.zip (se existir)
        run: |
          if [ -f NekoMusic.zip ]; then
            unzip -oq NekoMusic.zip -d src
          fi

      # Configurar Java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Configurar Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Aceitar licenças Android SDK
      - name: Aceitar licenças do Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Localizar projeto
      - name: Localizar projeto
        run: |
          ROOT=$(dirname "$(find . -maxdepth 4 -name settings.gradle.kts | head -n1)")

          if [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERRO: Projeto Android não encontrado!"
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Projeto em: $ROOT"

      # Executar testes
      - name: Testes unitários
        continue-on-error: true
        working-directory: ${{ env.ROOT }}
        run: gradle testDebugUnitTest --stacktrace

      # Gerar APK
      - name: Compilar APK debug
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --stacktrace

      # Localizar e preparar APK
      - name: Preparar APK
        run: |
          APK=$(find "$ROOT" -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          cp "$APK" NekoMusic.apk

          echo "APK gerado com sucesso!"

      # Disponibilizar APK como artefato, igual ao YGO
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEKO-MUSIC-APK
          path: NekoMusic.apk
          if-no-files-found: error

      # Publicar APK diretamente em Releases
      - name: Publicar APK em Lançamentos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" NekoMusic.apk \
            --title "NEKO MUSIC build ${{ github.run_number }}" \
            --notes "APK de instalação do NEKO MUSIC. Baixe NekoMusic.apk e instale no Android." \
            --latest
